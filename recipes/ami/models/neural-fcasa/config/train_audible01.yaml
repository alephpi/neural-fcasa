defaults:
  - global
  - hydra: default
  - datamodule: default
  - model: default
  - trainer: ddp
  - trainer/callbacks: default
  - trainer/logger: tensorboard
  - override hydra/launcher: submitit_slurm
  - _self_

datamodule:
  batch_size: 10
  cached: true

trainer:
  num_nodes: 1
  devices: 4
  accumulate_grad_batches: 3
  max_epochs: 200

hydra:
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    name: neural-fcasa
    partition: audible
    nodes: ${trainer.num_nodes}
    exclude: nodeaudible02
    gpus_per_node: ${trainer.devices}
    cpus_per_task: 16
    tasks_per_node: ${trainer.devices}
    mem_gb: 720
    timeout_min: 4000