defaults:
  - global
  - hydra: default
  - datamodule: default
  - model: default
  - trainer: ddp
  - trainer/callbacks: default
  - trainer/logger: tensorboard
  - override hydra/launcher: submitit_slurm
  - _self_

datamodule:
  batch_size: 8

trainer:
  num_nodes: 3
  devices: 2
  accumulate_grad_batches: 3
  max_epochs: 200

hydra:
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    name: neural-fcasa
    partition: V100-32GB
    nodes: 3
    gpus_per_node: 2
    cpus_per_task: 20
    tasks_per_node: 2
    mem_gb: 180
    timeout_min: 2880